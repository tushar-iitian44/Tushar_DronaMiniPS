# =====================================================
# SIMULATION & TIMING CONFIGURATION
# =====================================================
simulation:
  physics_hz: 500
  control_hz: 25
  simulation_time: 8.0
  target_altitude: 1.0

# =====================================================
# SWARM & FORMATION PARAMETERS
# =====================================================
swarm:
  n_drones: 4
  line_spacing: 0.45
  circle_radius: 0.45
  initial_z: 0.10
  start_z: 0.10
  land_z: 0.10

# =====================================================
# PID CONTROLLER PARAMETERS
# =====================================================
pid:
  natural_frequency: 3.5
  damping_ratio: 0.9
  ki: 0.015
  integral_limit: 2.0

# =====================================================
# WAVE CONFIGURATION
# =====================================================
wave:
  amplitude: 0.2
  wave_period: 6.0
  wave_cycles: 3

# =====================================================
# SAFETY & BOUNDARIES CONFIGURATION
# =====================================================
safety:
  x_min: -1.0
  x_max: 1.0
  y_min: -0.6
  y_max: 0.6
  z_min: 0.6
  z_max: 1.4
  min_separation: 0.35

# =====================================================
# FILE PATHS & OUTPUTS
# =====================================================
paths:
  model_dir: "/content/mujoco_menagerie/bitcraze_crazyflie_2"
  single_video_path: "/content/crazyflie_hover.mp4"
  single_csv_path: "/content/crazyflie_hover_log.csv"
  swarm_video_path: "/content/four_crazyflies.mp4"
  swarm_csv_path: "/content/four_drone_logs.csv"